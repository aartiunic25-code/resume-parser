<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(to right,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:10px;
            width:300px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            background:#4CAF50;
            color:white;
            border:none;
            padding:10px;
            width:100%;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <form action="/resume/login" method="post">

        <input type="text"
               name="username"
               placeholder="Username">

        <input type="password"
               name="password"
               placeholder="Password">

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
