<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Resume Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#74ebd5,#ACB6E5);
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:30px;
        }


        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        th{
            background:#4CAF50;
            color:white;
            padding:15px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
            transition:0.3s;
        }

    </style>

</head>

<body>

<h1>Resume Screening Dashboard</h1>
<a href="/resume/home"
style="padding:10px 20px;
background:#3498db;
color:white;
text-decoration:none;
border-radius:5px;">
Home
</a>


<form action="/resume/search" method="get"
      style="text-align:center;margin-bottom:20px;">

    <input type="text"
           name="keyword"
           placeholder="Search Resume"
           style="padding:10px;width:250px;">

    <button type="submit"
            style="padding:10px;background:#4CAF50;color:white;border:none;">
        Search
    </button>

</form>

<table>

    <tr>
        <th>Rank</th>
        <th>File Name</th>
        <th>Score</th>
        <th>Action</th>
        <th>Download</th>
    </tr>

    <tr th:each="resume, stat : ${resumes}">

        <td th:text="${stat.count}"></td>
        <td th:text="${resume.fileName}"></td>
        <td>

            <div style="width:100%; background:#ddd; border-radius:10px;">

                <div th:style="'width:' + ${resume.score} + '%; background:green; color:white; padding:5px; border-radius:10px;'"
                     th:text="${resume.score} + '%'">
                </div>

            </div>

        </td>
        <td>
            <a th:href="@{'/resume/delete/' + ${resume.id}}">
                <button style="background:red;
                       color:white;
                       border:none;
                       padding:8px;">
                    Delete
                </button>
            </a>
        </td>

        <td>
            <a th:href="@{'/resume/download/' + ${resume.id}}">
                <button style="
                background:green;
                color:white;
                border:none;
                padding:8px;
                border-radius:5px;">
                    Download
                </button>
            </a>
        </td>
    </tr>

</table>

</body>
</html>
